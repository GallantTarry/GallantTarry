<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --lumi-ink: light-dark(#000000, #e0e0e0);
      --lumi-muted: light-dark(#5f6368, #9aa0a6);
      --lumi-dim: light-dark(#f2f0f0, #242528);
      --lumi-container: light-dark(#e8e6e6, #2d2f33);
      --lumi-outline: light-dark(#727676, #9a9b9c);
      --lumi-accent-bg: light-dark(#dcf1ff, #192967);
      --lumi-primary: light-dark(#3186ff, #9dd2ff);
      --lumi-sans: 'Google Sans Flex', var(--font-family, 'Google Sans', sans-serif);
      --lumi-mono: 'Google Sans Code', ui-monospace, monospace;
    }
    text { font-weight: 400; stroke: none; }
    .t-l1 { font-family: var(--lumi-sans); font-size: 15px; fill: var(--lumi-ink); }
    .t-l2 { font-family: var(--lumi-mono); font-size: 13px; font-style: italic; fill: var(--lumi-ink); }
    .t-l4 { font-family: var(--lumi-sans); font-size: 13px; fill: var(--lumi-muted); }
    .node-step { fill: var(--lumi-dim); stroke: none; }
    .node-focal { fill: var(--lumi-accent-bg); stroke: var(--lumi-primary); stroke-width: 1.25; }
    .node-store { fill: var(--lumi-container); stroke: var(--lumi-outline); stroke-width: 1; }
    .edge-seg { fill: none; stroke: var(--lumi-ink); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 4; }
    .edge-arrow { fill: none; stroke: var(--lumi-ink); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 4; marker-end: url(#lumi-caret); }
  </style>
  <defs>
    <marker id="lumi-caret" viewBox="0 0 10 10" refX="7.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--lumi-ink)" stroke-width="1.3" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect class="node-step" x="20" y="36" width="164" height="80" rx="40" />
  <text class="t-l1" x="102" y="67" text-anchor="middle" dominant-baseline="central">用户浏览器</text>
  <text class="t-l4" x="102" y="89" text-anchor="middle" dominant-baseline="central">发起静态资源请求</text>

  <line class="edge-seg" x1="192" y1="62" x2="204" y2="62" />
  <rect x="208" y="52" width="44" height="20" rx="10" fill="var(--lumi-dim)" />
  <text class="t-l2" x="230" y="62" text-anchor="middle" dominant-baseline="central">HIT</text>
  <line class="edge-arrow" x1="256" y1="62" x2="192" y2="62" />

  <line class="edge-arrow" x1="192" y1="92" x2="256" y2="92" />

  <rect class="node-focal" x="264" y="36" width="172" height="80" rx="40" />
  <text class="t-l1" x="350" y="67" text-anchor="middle" dominant-baseline="central">CDN 边缘节点</text>
  <text class="t-l2" x="350" y="89" text-anchor="middle" dominant-baseline="central">Anycast 就近接入</text>

  <line class="edge-seg" x1="444" y1="76" x2="452" y2="76" />
  <rect x="456" y="66" width="52" height="20" rx="10" fill="var(--lumi-dim)" />
  <text class="t-l2" x="482" y="76" text-anchor="middle" dominant-baseline="central">MISS</text>
  <line class="edge-arrow" x1="512" y1="76" x2="520" y2="76" />

  <rect class="node-store" x="528" y="36" width="132" height="80" rx="40" />
  <text class="t-l1" x="594" y="67" text-anchor="middle" dominant-baseline="central">源站服务器</text>
  <text class="t-l4" x="594" y="89" text-anchor="middle" dominant-baseline="central">回源拉取并缓存</text>

  <path class="edge-arrow" d="M 350 124 L 350 148" />

  <rect class="node-store" x="242" y="156" width="216" height="80" rx="40" />
  <text class="t-l1" x="350" y="187" text-anchor="middle" dominant-baseline="central">缓存刷新与版本校验</text>
  <text class="t-l2" x="350" y="209" text-anchor="middle" dominant-baseline="central">ETag / 304 / Purge</text>
</svg>